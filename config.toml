# Handcart configuration: limits, timings, pins and interfaces.

[network]
backend_host = "127.0.0.1"   # only this machine: the frontend, telemetry, and SSH sessions on the Pi
backend_port = 8000
frontend_host = "127.0.0.1"   # only the display (another address is refused until there is a PIN)
frontend_port = 8080

[hotspot]  # the Wi-Fi network the handcart makes (Wi-Fi window, Hotspot): SSH where there is no Wi-Fi
ssid = "handcart"
password = "eagletrt"   # shown on the screen, to type it on the laptop

[can]
interface = "socketcan"   # python-can interface; elsewhere udp_multicast (see README)
bms_channel = "can0"
charger_channel = "can0"  # the same bus as the BMS, unless the charger gets its own
primary_dbc = "libs/libcan/dbc/primary/primary.dbc"
charger_dbc = "libs/charger/littlesic/LittleSIC.dbc"

[accumulator]
cellboards = 6
cells_per_cellboard = 24
temps_per_cellboard = 48
max_cell_voltage = 4.20       # V, charging stops here
balancing_threshold = 0.010   # V, cells above min + threshold are bled: the default, the operator can change it
balancing_threshold_min = 0.005   # V, the BMS takes it in 5 mV steps
balancing_threshold_max = 0.100   # V
cold_temperature = 15.0       # °C: below this a cell is cold (what charging should do then: asked the team)
warm_temperature = 45.0       # °C: above this a cell is warm
max_temperature = 55.0        # °C: above this the handcart stops everything, as an error

[charge]
# 144 cells in series: 604.8 V at 4.20 V/cell. Confirm the limits with the accumulator team.
target_voltage_min = 504      # V
target_voltage_max = 604      # V
target_voltage_default = 590  # V
current_max = 15.0            # A
current_default = 6.0         # A

[timing]
bms_presence_timeout = 0.5        # s without BMS frames before it counts as gone
charger_presence_timeout = 0.4    # s without charger frames before it counts as gone
bms_response_timeout = 3.0        # s for the BMS to start the precharge (or balancing)
precharge_timeout = 5.0          # s for the whole precharge, once started: then the TS goes off
charger_stop_delay = 0.2          # s between stopping the charger and cutting its power, on error
bms_repeat_period = 1.0           # s: balancing kept alive (the BMS gives up after 3 s), lost TS/balancing stops sent again
charger_ctrl_period = 0.01        # s, HYC_Ctrl
charger_alive_period = 0.1        # s, HYC_Alive
charger_target_period = 0.5       # s, HYC_Target

[shutdown]  # feedback voltages along the shutdown loop. Provisional: confirm with the electronics team.
closed_above = 10.0   # V, a point above this is closed
open_below = 2.0      # V, a point below this is open; in between counts as unknown

[hardware]
simulated = false   # true: fake relays, controls and feedbacks even on the Pi (off the Pi they always are)

[gpio]  # BCM numbering, handcart PCB
buzzer = 1
discharge_relay = 19
pon = 20
sd_relay = 21
button_up = 27
button_down = 24
button_left = 26
button_right = 23
encoder_press = 22   # clicking the encoder knob: the "confirm" button
encoder_a = 16
encoder_b = 17

[adc]  # MAX11335 reading the shutdown feedbacks
spi_bus = 0
spi_device = 1
spi_mode = 3
spi_max_speed_hz = 1000000
vref = 3.310
divider = 9.18
divider_correction = 1.3

[update]  # ./handcart.py update, and the System page of the UI
remote = "origin"
branch = "feat/new-software"   # the branch the handcart follows: change it here when the branch is renamed
health_timeout = 30       # s for the updated backend to answer; after that the update is rolled back

[auth]
session_timeout = 120     # s of inactivity before the operator is logged out
max_pin_failures = 5
lockout = 30              # s
users_file = "var/users.json"
audit_log = "var/audit.log"
